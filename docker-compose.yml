services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
      # Browser extension relay: the relay server (gateway+3 = 18792) binds to
      # 127.0.0.1 inside the container. A socat bridge on container port 18794
      # forwards to it, so we map host 18792 → container 18794.
      - "18792:18794"
    volumes:
      # All bind mounts — no named volumes, so everything maps to your local disk.
      # ./config and ./workspaces overlay their respective paths inside ./home.
      - ./home:/home/openclaw
      - ./config:/home/openclaw/.openclaw
      - ./workspaces:/home/openclaw/workspaces
    env_file:
      - .env
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true

  # Interactive CLI service for running openclaw commands
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-cli
    profiles:
      - cli
    volumes:
      - ./home:/home/openclaw
      - ./config:/home/openclaw/.openclaw
      - ./workspaces:/home/openclaw/workspaces

    env_file:
      - .env
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true
    entrypoint: ["openclaw"]
