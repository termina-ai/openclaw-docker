services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./workspaces:/home/openclaw/workspaces
    env_file:
      - .env
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true

  # Interactive CLI service for running openclaw commands
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-cli
    profiles:
      - cli
    volumes:
      - ./workspaces:/home/openclaw/workspaces
    env_file:
      - .env
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true
    entrypoint: ["openclaw"]
