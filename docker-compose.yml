services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"
    volumes:
      # Entire .openclaw context — config, memory, credentials, and all agent workspaces
      - ./openclaw-data:/home/openclaw/.openclaw
    env_file:
      - .env
    environment:
      - OPENCLAW_STATE_DIR=/home/openclaw/.openclaw
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true

  # Interactive CLI service for running openclaw commands
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-cli
    profiles:
      - cli
    volumes:
      - ./openclaw-data:/home/openclaw/.openclaw
    env_file:
      - .env
    environment:
      - OPENCLAW_STATE_DIR=/home/openclaw/.openclaw
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    stdin_open: true
    tty: true
    entrypoint: ["openclaw"]
