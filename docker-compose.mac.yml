# macOS override: bind the gateway port to localhost only so other devices
# on the network cannot reach it — refused at the OS level before auth.
services:
  openclaw:
    ports:
      !override
      - "127.0.0.1:18789:18789"
      # Browser extension relay — see docker-compose.yml for explanation.
      - "127.0.0.1:18792:18794"
