# macOS override: network_mode: host doesn't expose ports on Docker Desktop
# for Mac (it binds to the Linux VM, not the Mac host). This override swaps
# it for bridge networking with an explicit port mapping.
# Binding to 127.0.0.1 ensures only this machine can reach the gateway —
# other devices on the network are refused at the OS level before auth.
services:
  openclaw:
    network_mode: bridge
    ports:
      - "127.0.0.1:18789:18789"
